apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/vaibhav979/api-gateway:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_REDIS_HOST
              value: redis
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/gateway
            - name: SPRING_DATASOURCE_USERNAME
              value: gateway
            - name: SPRING_DATASOURCE_PASSWORD
              value: gateway
            - name: DOWNSTREAM_URL
              value: http://downstream:8080/downstream/data
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
