name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: Set lowercase owner
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build API Gateway
        working-directory: api_gateway
        run: mvn clean package -DskipTests

      - name: Build Downstream Service
        working-directory: DownStream-Service
        run: mvn clean package -DskipTests

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and Push API Gateway Image
        run: |
          docker build -t ghcr.io/${OWNER_LC}/api-gateway:latest ./api_gateway
          docker push ghcr.io/${OWNER_LC}/api-gateway:latest

      - name: Build and Push Downstream Image
        run: |
          docker build -t ghcr.io/${OWNER_LC}/downstream:latest ./DownStream-Service
          docker push ghcr.io/${OWNER_LC}/downstream:latest
