apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: resilient-system
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Vaibhav979/resilient-api-gateway
    targetRevision: HEAD
    path: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
